spring.application.name=tricky-quiz

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tricky_quiz}
spring.datasource.username=${DB_USERNAME:tricky_quiz_user}
spring.datasource.password=${DB_PASSWORD:tricky_quiz_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
